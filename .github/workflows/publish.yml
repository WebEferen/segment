name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example, v0.1.0)
        required: true
        type: string
      dry_run:
        description: Validate the package without publishing it to npm
        required: true
        default: true
        type: boolean

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release tag
        run: |
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "$RELEASE_TAG is not an existing Git tag." >&2
            exit 1
          fi

          package_version="$(node --print "require('./package.json').version")"
          expected_tag="v${package_version}"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $package_version (expected $expected_tag)." >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # npm invokes prepublishOnly in both modes. It runs the full suite and
      # verifies the packed tarball in a clean offline consumer.
      - name: Validate package without publishing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm publish --dry-run --access public

      - name: Publish package to npm
        if: ${{ github.event_name == 'release' || !inputs.dry_run }}
        run: npm publish --access public
